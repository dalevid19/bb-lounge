<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c7247f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="B&amp;B Lounge">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
#bbLogin, #bbLogin * { box-sizing: border-box; }
#bbLogin img { background: none; border: 0; box-shadow: none; padding: 0; border-radius: 0; height: auto; }
#bbLogin { position: fixed; inset: 0; z-index: 100; overflow-y: auto; overflow-x: hidden; display: grid; grid-template-columns: minmax(0, 400px); justify-content: center; align-content: center; padding: max(24px, env(safe-area-inset-top, 0px)) 16px max(24px, env(safe-area-inset-bottom, 0px));
  font-family: Poppins, system-ui, -apple-system, "Segoe UI", sans-serif; color: #2a1d23;
  background:
    radial-gradient(circle at 50% 78%, rgba(255,255,255,.55) 0, rgba(255,255,255,0) 22%),
    radial-gradient(ellipse 60% 26% at 50% 82%, #e98fa9 0, rgba(233,143,169,.55) 55%, rgba(233,143,169,0) 100%),
    radial-gradient(circle at 78% 30%, rgba(255,214,226,.9) 0, rgba(255,214,226,0) 34%),
    radial-gradient(ellipse 120% 40% at 50% 100%, #f2c3c9 0, #ecb2bb 60%, rgba(236,178,187,0) 100%),
    linear-gradient(180deg, #e7a0b2 0%, #f0b8c4 48%, #f3c9cd 70%, #edbac1 100%); }
#bbLogin::before { content: ""; position: fixed; left: -10%; right: -10%; top: 46%; height: 18%; pointer-events: none;
  background: radial-gradient(ellipse 30% 70% at 18% 100%, rgba(170,96,92,.45), transparent 70%), radial-gradient(ellipse 22% 80% at 52% 100%, rgba(180,104,98,.35), transparent 70%), radial-gradient(ellipse 30% 60% at 88% 100%, rgba(170,96,92,.4), transparent 70%); filter: blur(2px); }
#bbLogin .bb-box { position: relative; width: 100%; min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
#bbLogin .bb-card { position: relative; min-width: 0; padding: 22px 22px 18px; border-radius: 30px; background: linear-gradient(160deg, rgba(255,255,255,.72), rgba(255,255,255,.42)); border: 1px solid rgba(255,255,255,.75);
  box-shadow: 0 24px 60px -24px rgba(120,40,70,.45), inset 0 1px 0 rgba(255,255,255,.9); -webkit-backdrop-filter: blur(18px) saturate(1.2); backdrop-filter: blur(18px) saturate(1.2); }
#bbLogin .bb-logo { display: block; width: min(220px, 62%); margin: 0 auto 4px; }
#bbLogin .bb-top { display: flex; align-items: center; justify-content: space-between; margin: 6px 2px 16px; }
#bbLogin .bb-h { margin: 0; font-size: 26px; font-weight: 500; letter-spacing: -.3px; }
#bbLogin .bb-chip { font-size: 12px; font-weight: 500; padding: 5px 12px; border-radius: 99px; border: 1px solid rgba(42,29,35,.18); background: rgba(255,255,255,.55); }
#bbLogin form { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; min-width: 0; }
#bbLogin .bb-pill { min-width: 0; width: 100%; margin: 0; display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 7px; border-radius: 99px; background: rgba(255,255,255,.82); box-shadow: inset 0 0 0 1px rgba(255,255,255,.9), 0 2px 8px -4px rgba(120,40,70,.25); }
#bbLogin .bb-pill:focus-within { box-shadow: inset 0 0 0 2px #c7247f, 0 2px 8px -4px rgba(120,40,70,.25); }
#bbLogin .bb-ico { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: #fff; box-shadow: 0 1px 4px rgba(120,40,70,.18); color: #2a1d23; }
#bbLogin .bb-ico svg, #bbLogin .bb-eye svg, #bbLogin .bb-go svg { width: 17px; height: 17px; }
#bbLogin input { flex: 1 1 0; width: 0; min-width: 0; height: auto; box-shadow: none; border-radius: 0; font: inherit; font-size: 16px; border: 0; outline: 0; background: transparent; color: #2a1d23; padding: 8px 0; }
#bbLogin input::placeholder { color: #7a6870; }
#bbLogin #bbPass { letter-spacing: 4px; }
#bbLogin #bbPass::placeholder { letter-spacing: 0; }
#bbLogin .bb-eye { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 5px; font: inherit; font-size: 12px; font-weight: 500; color: #2a1d23; background: #fff; border: 0; border-radius: 99px; padding: 8px 12px; cursor: pointer; box-shadow: 0 1px 4px rgba(120,40,70,.18); }
#bbLogin .bb-row { min-width: 0; display: flex; align-items: center; gap: 14px; margin-top: 6px; }
#bbLogin .bb-row p { flex: 1; min-width: 0; white-space: normal; margin: 0; font-size: 12px; line-height: 1.45; color: #5b4a51; }
#bbLogin .bb-go { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; border: 0; cursor: pointer; font: inherit; font-size: 14px; font-weight: 500; color: #fff; background: #241a1f; border-radius: 99px; padding: 6px 6px 6px 18px; box-shadow: 0 10px 22px -10px rgba(36,26,31,.7); }
#bbLogin .bb-go span { width: 36px; height: 36px; border-radius: 50%; background: #fff; color: #241a1f; display: grid; place-items: center; }
#bbLogin .bb-go:disabled { opacity: .6; }
#bbLoginMsg:empty { display: none; }
#bbLoginMsg { margin: 2px 4px 0; color: #a3123f; font-size: 13px; font-weight: 500; }
#bbLogin .bb-foot { text-align: center; font-size: 12px; font-weight: 500; color: #4a3940; margin: 0; }
#bbLogin .bb-dark { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; border-radius: 26px; background: #201a1d; color: #fff; }
#bbLogin .bb-dark b { display: block; font-size: 19px; font-weight: 500; }
#bbLogin .bb-dark span { font-size: 13px; color: #b9a9b0; }
#bbLogin .bb-dark i { font-style: normal; font-size: 13px; color: #fff; }
</style>
<script src="vendor-supabase.js"></script>
<script src="config.js"></script>
</head>
<body>
<div id="bbLogin" hidden>
  <div class="bb-box">
    <div class="bb-card">
      <img class="bb-logo" src="icon-logo.png" alt="B&amp;B Lounge, at your own place">
      <div class="bb-top"><p class="bb-h">Log in</p><span class="bb-chip">Staff only</span></div>
      <form id="bbLoginForm" autocomplete="on">
        <label class="bb-pill"><span class="bb-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></span>
          <input id="bbUser" name="username" placeholder="username" aria-label="Username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required></label>
        <label class="bb-pill"><span class="bb-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l3 3M15 8l2 2"/></svg></span>
          <input id="bbPass" name="password" type="password" placeholder="6-digit PIN" aria-label="PIN" inputmode="numeric" autocomplete="current-password" required>
          <button type="button" class="bb-eye" id="bbEye" aria-pressed="false" aria-label="Show PIN">Show</button></label>
        <p id="bbLoginMsg" role="alert"></p>
        <div class="bb-row"><p>Forgot your PIN? Ask the owner to give you a new one.</p>
          <button class="bb-go" id="bbLoginBtn" type="submit">Sign in<span aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></span></button></div>
      </form>
    </div>
    <div class="bb-dark"><div><b>B&amp;B Lounge</b><span>Nails · Lash · Spa</span></div><i>At your own place</i></div>
  </div>
</div>
<script>
/* B&B Lounge website: connects the app to Supabase (sign-in, live data, logo, downloads).
   The app itself is the same code as the Claude version; this file provides the services it asks for. */
(() => {
  "use strict";
  const CFG = window.BB_CONFIG || {};
  const sb = window.supabase.createClient(CFG.url, CFG.anonKey, { auth: { persistSession: true, autoRefreshToken: true, storageKey: "bb-auth", lock: async (_n, _t, fn) => await fn() }, realtime: { params: { eventsPerSecond: 20 } } });
  const pinPw = (v) => /^\d{6}$/.test(String(v || "").trim()) ? "bb-pin-" + String(v).trim() : String(v || "");
  const emailOf = (u) => String(u || "").trim().toLowerCase() + "@staff.bblounge.app";
  const $ = (s) => document.querySelector(s);

  /* ---------- sign-in screen ---------- */
  let resolveReady; const ready = new Promise(r => { resolveReady = r; });
  let profile = null, user = null;
  function showLogin(msg) {
    const el = $("#bbLogin"); el.hidden = false;
    $("#bbLoginMsg").textContent = msg || "";
    setTimeout(() => { const u = $("#bbUser"); if (u && !u.value) u.focus(); }, 50);
  }
  const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);
  let authing = false;
  async function afterAuth(session) {
    user = session.user;
    const { data, error } = await withTimeout(sb.from("profiles").select("*").eq("user_id", user.id).maybeSingle(), 20000);
    if (error || !data) { await sb.auth.signOut().catch(() => {}); showLogin("This account isn't set up yet. Ask the owner to add you."); return; }
    if (!data.active) { await sb.auth.signOut().catch(() => {}); showLogin("This account is blocked. Ask the owner."); return; }
    profile = data;
    window.SITE.session = { id: data.user_id, name: data.name, role: data.role, staff: data.staff_id || "" };
    $("#bbLogin").hidden = true;
    resolveReady();
    push.sub().then((s) => s && Notification.permission === "granted" && push.save(s)).catch(() => {});
  }
  document.addEventListener("submit", async (ev) => {
    if (ev.target.id !== "bbLoginForm") return;
    ev.preventDefault();
    if (authing) return; authing = true;
    const btn = $("#bbLoginBtn"); btn.disabled = true; $("#bbLoginMsg").textContent = "Signing in…";
    try {
      const { data, error } = await withTimeout(sb.auth.signInWithPassword({ email: emailOf($("#bbUser").value), password: pinPw($("#bbPass").value) }), 20000);
      if (error) { $("#bbLoginMsg").textContent = /invalid/i.test(error.message) ? "Wrong username or PIN." : error.message; $("#bbPass").value = ""; $("#bbPass").focus(); return; }
      await afterAuth(data.session);
    } catch (e) {
      try { Object.keys(localStorage).filter(k => /^sb-|^bb-auth/.test(k)).forEach(k => localStorage.removeItem(k)); } catch (_) {}
      $("#bbLoginMsg").textContent = e.message === "timeout" ? "This is taking too long. Check your internet, then tap Sign in again." : "Couldn't sign in: " + e.message;
    } finally { authing = false; btn.disabled = false; }
  });
  try { Object.keys(localStorage).filter(k => /^sb-.*-auth-token$/.test(k)).forEach(k => localStorage.removeItem(k)); } catch (_) {}
  withTimeout(sb.auth.getSession(), 10000).then(({ data }) => { if (data.session) return afterAuth(data.session); showLogin(""); }).catch(() => { try { localStorage.removeItem("bb-auth"); } catch (_) {} showLogin(""); });

  document.addEventListener("click", (ev) => {
    const e = ev.target.closest("#bbEye"); if (!e) return; ev.preventDefault();
    const i = $("#bbPass"), show = i.type === "password"; i.type = show ? "text" : "password";
    e.textContent = show ? "Hide" : "Show"; e.setAttribute("aria-pressed", show); e.setAttribute("aria-label", show ? "Hide PIN" : "Show PIN");
  });
  /* ---------- live document store (same shape the app already uses) ---------- */
  const cols = new Map(); // col -> { map: Map(id -> snapshot), subs: Set(cb), loaded }
  const freeze = (o) => { if (o && typeof o === "object") { Object.values(o).forEach(freeze); Object.freeze(o); } return o; };
  const mkSnap = (id, data) => ({ id, exists: data != null, data: () => data == null ? undefined : data, metadata: { fromCache: false, hasPendingWrites: false } });
  const colState = (c) => { if (!cols.has(c)) cols.set(c, { map: new Map(), subs: new Set(), loaded: false, loading: null }); return cols.get(c); };
  const emit = (c) => { const st = colState(c); const docs = [...st.map.values()].sort((a, b) => a.id < b.id ? -1 : 1); const snap = { docs, size: docs.length, empty: !docs.length, metadata: { fromCache: false, hasPendingWrites: false }, docChanges: () => [] }; st.subs.forEach(cb => { try { cb(snap); } catch (e) { console.error(e); } }); };
  const put = (c, id, data) => { const st = colState(c); if (data == null) st.map.delete(id); else st.map.set(id, mkSnap(id, freeze(JSON.parse(JSON.stringify(data))))); };
  async function loadCol(c) {
    const st = colState(c); if (st.loaded) return; if (st.loading) return st.loading;
    st.loading = (async () => {
      let from = 0; const size = 1000;
      for (;;) {
        const { data, error } = await sb.from("docs").select("id,data").eq("col", c).range(from, from + size - 1);
        if (error) throw error;
        data.forEach(r => put(c, r.id, r.data));
        if (data.length < size) break; from += size;
      }
      st.loaded = true;
    })();
    return st.loading;
  }
  let channel = null;
  function listen() {
    if (channel) return;
    channel = sb.channel("docs-live").on("postgres_changes", { event: "*", schema: "public", table: "docs" }, (p) => {
      const row = p.new && p.new.col ? p.new : p.old; if (!row || !row.col) return;
      if (!cols.has(row.col)) return;
      if (p.eventType === "DELETE") put(row.col, row.id, null); else put(row.col, row.id, p.new.data);
      emit(row.col);
    }).subscribe();
  }
  const newId = () => Array.from(crypto.getRandomValues(new Uint8Array(10)), b => "abcdefghijklmnopqrstuvwxyz0123456789"[b % 36]).join("");
  const err = (e) => { const x = new Error(e && e.message || String(e)); x.code = /row-level security|permission/i.test(x.message) ? "invalid_argument" : "unavailable"; return x; };
  async function write(c, id, data) {
    const { error } = await sb.from("docs").upsert({ col: c, id, data, updated_at: new Date().toISOString() });
    if (error) throw err(error);
    put(c, id, data); emit(c);
  }
  function docRef(path) {
    const [c, id] = path.split("/");
    return {
      id, path,
      async get() { const st = colState(c); if (st.loaded) return st.map.get(id) || mkSnap(id, null); const { data, error } = await sb.from("docs").select("data").eq("col", c).eq("id", id).maybeSingle(); if (error) throw err(error); return mkSnap(id, data ? freeze(data.data) : null); },
      async set(d) { await write(c, id, d); },
      async update(d) { const cur = await this.get(); if (!cur.exists) { const x = new Error("That record no longer exists."); x.code = "invalid_argument"; throw x; } await write(c, id, Object.assign(JSON.parse(JSON.stringify(cur.data())), d)); },
      async delete() { const { error } = await sb.from("docs").delete().eq("col", c).eq("id", id); if (error) throw err(error); put(c, id, null); emit(c); },
      onSnapshot(cb, onErr) { const st = colState(c); const f = () => cb(st.map.get(id) || mkSnap(id, null)); st.subs.add(f); listen(); loadCol(c).then(f).catch(e => onErr && onErr(err(e))); return () => st.subs.delete(f); },
      collection() { throw new Error("Nested collections are not used on the website"); }
    };
  }
  function colRef(c) {
    return {
      path: c,
      doc: (id) => docRef(c + "/" + (id || newId())),
      async add(d) { const ref = docRef(c + "/" + newId()); await ref.set(d); return ref; },
      onSnapshot(cb, onErr) { const st = colState(c); st.subs.add(cb); listen(); loadCol(c).then(() => emit(c)).catch(e => onErr && onErr(err(e))); return () => st.subs.delete(cb); },
      async get() { await loadCol(c); const docs = [...colState(c).map.values()]; return { docs, size: docs.length, empty: !docs.length }; }
    };
  }
  const db = { doc: docRef, collection: colRef };

  /* ---------- who is signed in ---------- */
  const userApi = {
    canEdit: async () => !!profile && (profile.role === "owner" || profile.role === "hr"),
    isOwner: async () => !!profile && profile.role === "owner",
    id: async () => user ? user.id : null,
    can: async () => true,
    me: async () => ({ id: user && user.id, name: profile && profile.name }),
    profiles: async (ids) => { const { data } = await sb.from("profiles").select("user_id,name").in("user_id", ids); const out = {}; (data || []).forEach(p => { out[p.user_id] = { id: p.user_id, name: p.name }; }); return out; }
  };

  /* ---------- logo uploads ---------- */
  const assets = {
    async upload(file) { const ext = (file.name || "logo.png").split(".").pop().toLowerCase(); const key = `logo-${Date.now()}.${ext}`; const { error } = await sb.storage.from("assets").upload(key, file, { upsert: true, contentType: file.type }); if (error) throw err(error); return { id: key, url: sb.storage.from("assets").getPublicUrl(key).data.publicUrl, contentType: file.type }; },
    async delete(id) { await sb.storage.from("assets").remove([id]); },
    async list() { return { assets: [] }; }
  };

  /* ---------- CSV downloads ---------- */
  const downloads = { async save({ filename, data }) { const blob = data instanceof Blob ? data : new Blob([data], { type: "text/csv" }); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); return { status: "saved" }; } };

  /* ---------- staff accounts (owner) ---------- */
  const helper = window.supabase.createClient(CFG.url, CFG.anonKey, { auth: { persistSession: false, autoRefreshToken: false, storageKey: "bb-helper" } });
  /* ---------- phone alerts (web push) ---------- */
  const urlB64 = (str) => { const pad = "=".repeat((4 - str.length % 4) % 4); const raw = atob((str + pad).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(raw, (c) => c.charCodeAt(0)); };
  const push = {
    supported: () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window,
    needsHomeScreen: () => /iPhone|iPad|iPod/.test(navigator.userAgent) && !(navigator.standalone || (window.matchMedia && matchMedia("(display-mode: standalone)").matches)),
    async sub() { if (!push.supported()) return null; const r = await navigator.serviceWorker.getRegistration(); return r ? await r.pushManager.getSubscription() : null; },
    async status() {
      if (push.needsHomeScreen()) return "homescreen";
      if (!push.supported()) return "unsupported";
      if (Notification.permission === "denied") return "denied";
      return (await push.sub()) && Notification.permission === "granted" ? "on" : "off";
    },
    async save(s) { const j = s.toJSON(); const { error } = await sb.from("push_subs").upsert({ endpoint: j.endpoint, user_id: user.id, sub: j }); if (error) throw err(error); },
    async enable() {
      const perm = await Notification.requestPermission();
      if (perm !== "granted") throw new Error("Alerts weren't allowed. To fix it, allow notifications for this site in your phone or browser settings.");
      const reg = await navigator.serviceWorker.register("config.js", { scope: "./" });
      await navigator.serviceWorker.ready;
      let s = await reg.pushManager.getSubscription();
      if (!s) s = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64(CFG.vapid) });
      await push.save(s);
    },
    async disable() { const s = await push.sub(); if (!s) return; await sb.from("push_subs").delete().eq("endpoint", s.endpoint); await s.unsubscribe(); },
    async forget() { try { const s = await push.sub(); if (s) await sb.from("push_subs").delete().eq("endpoint", s.endpoint); } catch (_) {} }
  };
  window.SITE = {
    session: null,
    push,
    signOut: async () => { await push.forget(); await sb.auth.signOut(); location.reload(); },
    async listAccounts() { const { data, error } = await sb.from("profiles").select("*"); if (error) throw err(error); return data; },
    async createAccount({ username, password, name, role, staff_id }) {
      const { data, error } = await helper.auth.signUp({ email: emailOf(username), password: pinPw(password) });
      if (error) throw new Error(/registered|exists/i.test(error.message) ? "That username is already taken." : error.message);
      const { error: e2 } = await sb.rpc("owner_add_profile", { p_user: data.user.id, p_username: username, p_name: name, p_role: role, p_staff: staff_id || "" });
      if (e2) throw err(e2);
    },
    async updateAccount(uid, d) { const { error } = await sb.from("profiles").update({ name: d.name, role: d.role, staff_id: d.staff_id || "", active: d.active }).eq("user_id", uid); if (error) throw err(error); },
    async setPassword(uid, pw) { const { error } = await sb.rpc("owner_set_password", { p_user: uid, p_password: pinPw(pw) }); if (error) throw err(error); },
    async changeMyPassword(pw) { const { error } = await sb.auth.updateUser({ password: pinPw(pw) }); if (error) throw err(error); }
  };

  /* ---------- what the app asks for ---------- */
  const services = { db, user: userApi, assets, downloads };
  window.claude = { use: async (name) => { await ready; return services[name] || null; } };
})();

</script>
<title>B&amp;B Lounge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: left rail of salon sections on desktop, scrolling tab strip on phones; each section = header + action bar + working table. Palette: lacquer plum accent on a faintly rosy neutral. */
:root {
  --bg: #f7f4f5; --surface: #ffffff; --surface-2: #f0eaec; --line: #e2d8dc;
  --ink: #241a1f; --muted: #6f5f66; --accent: #8a2a55; --accent-ink: #ffffff; --accent-soft: #f6e3ec;
  --good: #23784a; --good-soft: #def2e6; --warn: #9a5b00; --warn-soft: #fbedd5; --bad: #b3261e; --bad-soft: #fbe2df;
  --cash: #2f7d5b; --gcash: #2463c9; --bdo: #c08a1a; --bar-2: #e3c4d3;
  --f-display: "Fraunces", Georgia, "Times New Roman", serif;
  --f-body: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --r: 10px;
}

}

/* ---------- date group rows ---------- */
function grouped(rows, keyFn, labelFn, cols, rowFn, subFn) {
  let out = "", key = null;
  rows.forEach((r, i) => {
    const k = keyFn(r);
    if (k !== key) { key = k; const grp = rows.filter(x => keyFn(x) === k); out += `<tr class="grp"><td colspan="${cols}">${labelFn(k, grp)}${subFn ? `<span class="gs">${subFn(grp)}</span>` : ""}</td></tr>`; }
    out += rowFn(r, i);
  });
  return out;
}

const CASH_TRACK_FROM = "2026-11-21";

      <div class="actions"><button class="btn sm primary" data-act="remitAll" data-k="${esc(c.id || "")}">Mark all remitted</button><button class="btn sm" data-act="techCash" data-k="${esc(c.id || "")}">See bookings</button></div></div>`).join("")}</div>`
    : `<div class="panel" style="margin-bottom:16px"><div class="empty"><b>All cash is remitted</b>When a technician receives cash for a booking, it shows here until you mark it as handed over.</div></div>`;
  const tabs = [["pending", `Not yet remitted (${allPend.length})`], ["done", "Remitted"]];
  html += `<div class="panel"><div class="ph"><div class="toolbar"><div class="seg" role="group" aria-label="Status">${tabs.map(([k, l]) => `<button type="button" data-act="cashTab" data-k="${k}" aria-pressed="${ui.cashTab === k}">${l}</button>`).join("")}</div>${techFilter()}</div>

function recalcBooking() {

  $("#bkLines", dform).querySelectorAll("tr").forEach(tr => { const l = bkLines[+tr.dataset.i]; tr.querySelector("[data-amt]").textContent = money(num(l.qty) * num(l.price)); });
  const dp = fv("dpPaid") === "1" ? num(fv("dpAmount")) : 0;
  const tip = num(fv("tip")), tipVia = fv("tipVia") || "gcash", tipOn = tip && tipVia !== "cash" ? tip : 0;
  const tot = sub + trInputs(), payNow = METHODS.reduce((a, [k]) => a + num(fv("pay_" + k)), 0), paid = payNow + dp;
  const tech = staffById(fv("techId")), rate = fv("commRate") === "" ? num(tech && tech.commRate != null ? tech.commRate : commDefault()) : num(fv("commRate"));
  const tmp = { items: bkLines.map(l => ({ ...l, techId: twoTech() && l.techId === fv("techId2") ? fv("techId2") : "" })), discount: num(fv("discount")), techId: fv("techId"), techId2: twoTech() ? fv("techId2") : "", commRate: fv("commRate") === "" ? undefined : num(fv("commRate")), backjob: dform.elements.backjob && dform.elements.backjob.checked };
  const shares = techShares(tmp), comm = Object.values(shares).reduce((a, o) => a + o.comm, 0);
  const commSplit = twoTech() ? Object.entries(shares).map(([t, o]) => `${esc(((staffById(t) || {}).name || "Main").split(" ")[0])} ${money(o.comm)}`).join(" · ") : "";
  const bal = r2(tot + tipOn - paid);
  $("#bkTotal", dform).innerHTML = `<b>${tot <= 0 ? "No services yet" : bal > 0.005 ? "Balance " + money(bal) : bal < -0.005 ? "Over by " + money(-bal) : "Fully paid"}</b><span class="note">Total ${money(tot)}${tipOn ? ` + tip ${money(tipOn)}` : ""} · commission ${money(comm)}</span>`;
  const row = (l, v, cls = "") => `<div class="sr ${cls}"><span>${l}</span><span class="num">${v}</span></div>`;
  $("#bkSum", dform).innerHTML = `<div class="sect" style="margin-bottom:6px">Summary</div>
    ${row("Total amount of services", money(sub + num(fv("discount"))))}
    ${num(fv("discount")) ? row("Less discount", "−" + money(fv("discount"))) : ""}
    ${row(`Transpo fee${trInputs() ? ` <span class="note">(going ${money(fv("transpoGo"))} · return ${money(fv("transpoBack"))})</span>` : ""}`, money(trInputs()))}
    ${row("Total", money(tot), "tot")}
    ${tipOn ? row(`Plus tip <span class="note">(paid by ${tipVia === "bdo" ? "BDO" : "GCash"} with the bill, for ${esc(((staffById(fv("techId")) || {}).name || "").split(" ")[0] || "the technician")})</span>`, "+" + money(tipOn)) + row("Total to collect", money(tot + tipOn), "tot") : ""}
    ${row(dp ? `Less downpayment <span class="note">(${(METHODS.find(m => m[0] === fv("dpMethod")) || ["", "GCash"])[1]})</span>` : "Downpayment", dp ? "−" + money(dp) : "No DP yet")}
    ${payNow ? row("Paid on the day", "−" + money(payNow)) : ""}
    ${row("Remaining balance to pay", money(Math.max(bal, 0)), "bal")}
    ${tip && !tipOn ? row("Tip (cash, kept by the technician)", money(tip), "note") : ""}
    ${commSplit ? row("Commission split", commSplit, "note") : ""}`;
  $("#bkBal", dform).innerHTML = paid ? (Math.abs(bal) < 0.01 ? '<span class="pill ok">Fully paid</span>' : bal > 0 ? `<span class="pill low">Balance ${money(bal)}</span>` : `<span class="pill acc">Over by ${money(-bal)}</span>`) : "";
}

function payLine(tr) {

      if (/,/.test(l) || /\b(st|street|ave|avenue|rd|road|village|subd|subdivision|brgy|barangay|city|tower|unit|blk|block|lot|condo|residences?|bldg|building|phase|homes|q\.?c|manila|makati|taguig|pasig|mandaluyong|marikina|cainta)\b/i.test(l)) { addr.push(l); break; } }
  }
  r.address = [...new Set(addr)].join(" · ");
  for (let i = 0; i < firstBlock; i++) { const l = lines[i]; if (!l || isOrd(l) || /address|pin/i.test(l)) continue; const d = readDate(l); if (d.date || d.time) { if (d.date && !r.date) r.date = d.date; if (d.time && !r.time) r.time = d.time; if (r.date) break; } }
  // technician lines: "2nd Lea", "6th April - Nov 20", "2nd Judyanne & April - Nov. 20"
  const ords = lines.map((l, i) => ({ l, i })).filter(o => isOrd(o.l));
  const hist = ords.filter(o => hasDate(o.l)), head = ords.filter(o => !hasDate(o.l));
  r.pastTechs = hist.map(o => o.l.replace(/\s+/g, " ")).join(" · ");
  const today = r.date ? hist.find(o => readDate(o.l).date === r.date) : null;
  if (today) { r.visit = today.l.match(/^\d{1,2}(st|nd|rd|th)/i)[0]; r.techs = matchTechs(today.l.replace(/^\d{1,2}(st|nd|rd|th)/i, "").replace(/\btech\b/gi, "")); }
  else if (hist.length) r.visit = ordinal(hist.length + 1);
  if (!r.techs.length) { const h = head.find(o => /[a-z]{3,}/i.test(o.l.replace(/^\d{1,2}(st|nd|rd|th)/i, ""))); if (h) r.techs = matchTechs(h.l.replace(/^\d{1,2}(st|nd|rd|th)/i, "")); }
  if (head.length) r.notes.push("Order for the day: " + head.map(o => o.l).join(" · "));
  // downpayment and notes
  lines.forEach(l => { if (/\bno\s*d\.?p\b/i.test(l)) r.dp = 0; else { const m = l.match(/\b(?:dp|d\.p\.|down\s*payment|downpayment)\b[^0-9]{0,15}([\d,]+)/i); if (m) { r.dp = num(m[1].replace(/,/g, "")); const mm = l.match(/gcash|bdo|cash/i); if (mm) r.dpMethod = mm[0].toLowerCase(); } } });
  const nIdx = lines.findIndex(l => /^notes?\b/i.test(l));
  if (nIdx >= 0) { const rest = lines[nIdx].replace(/^notes?\s*:?/i, "").trim(); if (rest && !/\bd\.?p\b/i.test(rest)) r.notes.push(rest);
    for (let i = nIdx + 1; i < lines.length; i++) { const l = lines[i]; if (isOrd(l) || /^(thank|salamat)/i.test(l)) break; if (l && !/\b(no\s*)?d\.?p\b/i.test(l) && !/^total\b/i.test(l)) r.notes.push(l); } }
  return r;
}

function applyRead(r, onlyEmpty) {
  const el = dform.elements, set = (n, v) => { if (v && el[n] && (!onlyEmpty || !String(el[n].value).trim())) el[n].value = v; };
  set("client", r.client); set("phone", r.phone); set("address", r.address); set("time", r.time);
  if (/^\d{4}-\d{2}-\d{2}$/.test(r.date || "") && (!onlyEmpty || !r._dateSet)) { el.date.value = r.date; el.status.value = r.date > todayStr() ? "booked" : "done"; }
  set("visit", r.visit); set("pastTechs", r.pastTechs);
  if (r.notes && r.notes.length) { const add = r.notes.filter(n => !String(el.notes.value).includes(n)); if (add.length) el.notes.value = [el.notes.value, ...add].filter(Boolean).join(" · "); }
  if (r.dp > 0) { el.dpPaid.value = "1"; el.dpAmount.disabled = false; el.dpMethod.disabled = false; el.dpAmount.value = r.dp; if (r.dpMethod) el.dpMethod.value = r.dpMethod; }
  else if (r.dp === 0 && !onlyEmpty) { el.dpPaid.value = "0"; el.dpAmount.value = ""; el.dpAmount.disabled = true; el.dpMethod.disabled = true; }
  if (r.techs && r.techs.length && (!onlyEmpty || !fv("techId"))) { el.techId.value = r.techs[0].id; el.techId2.value = r.techs[1] ? r.techs[1].id : ""; }
  if (r.items && r.items.length && (!onlyEmpty || !bkLines.some(l => l.name))) { bkLines = r.items.map(x => ({ ...x })); drawLines(); }
  el.channel.value = "Facebook";
}
async function aiFill() {
  const msg = $("#aiMsg", dform), text = ($("#aiText", dform) || {}).value || "", file = (($("#aiShot", dform) || {}).files || [])[0];
  if (!text.trim() && !file) { msg.textContent = "Paste the message first."; return; }
  const btn = dform.querySelector('[data-act="aiFill"]'); if (btn) btn.disabled = true;
  // 1. Built-in reader: free, instant, works offline.
  const r = text.trim() ? readMessage(text) : null;
  if (r) applyRead(r, false);
  const missing = () => ["client", "date"].filter(n => !fv(n)).concat(bkLines.some(l => l.name) ? [] : ["services"]);
  // 2. Only for a screenshot, or when something is still missing, ask Claude (if this page can).
  if (S.sample && (file || missing().length)) {
    msg.textContent = "Reading the rest of the message…";
    try { const ai = await aiRead(text, file); if (ai) applyRead(ai, true); } catch { }
  }
  syncLines(); drawLines(); showHistory(null);
  const lines = bkLines.filter(l => l.name), sum = lines.reduce((a, l) => a + num(l.qty) * num(l.price), 0);
  const parts = [];
  const news = lines.filter(l => l.serviceId === "__custom").map(l => l.name.replace(/\s*\(.*\)/, ""));
  if (news.length) parts.push(`Not on your price list yet: ${news.join(", ")} (price taken from the message).`);
  if (r && r.total && Math.abs(r.total - sum) > 1) parts.push(`The message says total ${money(r.total)} but the services add up to ${money(sum)}. Check the prices.`);
  if (twoTech()) parts.push(`Two technicians: choose who did each service under "Done by".`);
  const miss = missing(); if (!fv("techId")) miss.push("technician");
  msg.textContent = (lines.length || fv("client") ? "Filled in from the message. " : "Couldn't find the booking details in that text. ") + parts.join(" ") + (miss.length ? ` Still needed: ${miss.join(", ")}.` : "") + " Check everything, then tap Save booking.";
  const note = $("#aiNote", dform); if (note) { note.textContent = msg.textContent; note.hidden = false; }
  $("#aiBox", dform).open = !lines.length; recalcBooking();
  if (btn) btn.disabled = false;
  const sb = dform.querySelector('button[type="submit"]'); if (sb && lines.length) sb.focus();
}
async function aiRead(text, file) {
  const t = todayStr(), menu = S.services.filter(x => x.active !== false).map(x => `${x.id}: ${x.name} — ${num(x.price)}`).join("\n");
  const prompt = `You read a booking request that a client sent on Facebook Messenger to B&B, a nail, lash and spa home-service salon in Metro Manila. Messages may mix English and Tagalog. Today is ${t} (${parseD(t).toLocaleDateString("en-PH", { weekday: "long" })}).
Price list (id: name — price in pesos):
${menu}

Return only a JSON object: {"client": "", "phone": "", "address": "", "date": "YYYY-MM-DD", "time": "HH:MM 24-hour", "technician": "", "services": [{"serviceId": "id from the price list or empty", "name": "", "price": 0, "qty": 1}], "notes": ""}
Use an empty string for anything the message does not say. Do not invent details.${text.trim() ? `\n\nMessage:\n"""${text.slice(0, 6000)}"""` : "\n\nThe message is in the attached screenshot of the chat."}`;
  const opts = { modelTier: "default" }; if (file) opts.images = [file];
  const a = await S.sample.json(prompt, opts);
  const svc = Array.isArray(a.services) ? a.services : [];
  return { client: a.client, phone: a.phone, address: a.address, date: a.date, time: a.time, notes: a.notes ? [a.notes] : [],
    techs: a.technician ? matchTechs(a.technician) : [],
    items: svc.map(x => { const sv = find("services", x.serviceId) || matchService(x.name, x.price); const pr = num(x.price); return sv ? { serviceId: sv.id, name: sv.name, qty: num(x.qty) || 1, price: pr || num(sv.price) } : { serviceId: "__custom", name: x.name || "", qty: num(x.qty) || 1, price: pr || "" }; }).filter(l => l.name) };
}

/* ---------- CSV ---------- */
const toCsv = (rows) => rows.map(r => r.map(v => { const s = String(v ?? ""); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(",")).join("\n");
function parseCsv(text) {
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) { const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true; else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; } else f += c; }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
async function exportCsv(kind) {
  auditEvent("export", kind[0].toUpperCase() + kind.slice(1) + " list (CSV)");
  let rows;
  if (kind === "bookings") rows = [["Date", "Time", "Client", "Number", "Address", "Services", "Tech", "Status", "Service total", "Transpo going", "Transpo return", "Transpo total", "Total overall", "Commission", "Cash", "GCash", "BDO", "Tip", "Tip paid by", "Backjob", "Notes"], ...[...S.bookings].sort(byWhenAsc).map(b => [b.date, b.time, b.client, b.phone, b.address, (b.items || []).map(i => `${i.name} x${i.qty} @${i.price}`).join("; "), techName(b), b.status, svcTotal(b), trSplit(b)[0], trSplit(b)[1] ?? "", b.transpo, overall(b), commission(b), (b.pay || {}).cash, (b.pay || {}).gcash, (b.pay || {}).bdo, b.tip, b.tip ? ({ gcash: "GCash", bdo: "BDO", cash: "Cash to tech" }[b.tipVia] || "") : "", b.backjob ? "yes" : "", b.notes])];
  if (kind === "services") rows = [["Service", "Category", "Price"], ...S.services.map(s => [s.name, s.category, s.price])];
  if (kind === "inventory") rows = [["Item", "Category", "Qty", "Unit", "Last counted"], ...S.inventory.map(i => [i.name, i.category, i.qty, i.unit, i.counted])];
  if (kind === "expenses") rows = [["Date", "Category", "Item", "Qty", "Amount", "Note"], ...S.expenses.map(e => [e.date, e.category, e.item, e.qty, e.amount, e.note])];
  if (kind === "staff") rows = [["Name", "Role", "Phone", "Commission %", "Daily rate", "OT per hour", "Active"], ...S.staff.map(s => [s.name, s.role, s.phone, s.commRate, payOf(s.id).dailyRate, payOf(s.id).otRate, s.active !== false ? "yes" : "no"])];
  if (kind === "backjobs") rows = [["Date", "Client", "Number", "Service", "Reason", "Tech responsible", "Redone by", "Deduction", "Status"], ...S.backjobs.map(x => [x.date, x.client, x.phone, x.service, x.reason, (staffById(x.techId) || {}).name, (staffById(x.redoTechId) || {}).name, x.amount, x.status])];
  if (kind === "payroll") rows = [["Week start", "Week end", "Staff", "Days", "Basic", "OT hrs", "OT pay", "Commission", "Tips", "Gross", "Cash adv/backjob", "Late", "SSS", "PhilHealth", "Pag-IBIG", "Take-home", "Paid", "Paid on"], ...S.payroll.flatMap(p => (p.lines || []).map(l => [l.periodStart || p.periodStart, l.periodEnd || p.periodEnd, l.name, l.days, l.basic, l.otHours, l.otPay, l.commission, l.tips, l.gross, l.cashAdvance, l.late, l.sss, l.philhealth, l.pagibig, l.net, linePaid(p, l) ? "yes" : "no", l.paidOn || ""]))];
  if (!rows) return;
  if (!S.downloads) { toast("Downloads aren't available in this view"); return; }
  try { await S.downloads.save({ filename: `${kind}-${todayStr()}.csv`, data: toCsv(rows) }); } catch (err) { if (err && err.code !== "declined") toast("Couldn't save the file"); }
}
const pick = (h, r, names) => { for (const n of names) { const i = h.findIndex(x => x === n || x.includes(n)); if (i >= 0 && (r[i] || "").trim()) return r[i].trim(); } return ""; };
const normDate = (s) => { if (!s) return todayStr(); if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10); const d = new Date(s); return isNaN(d) ? todayStr() : iso(d); };
function mapRow(kind, h, r) {
  if (kind === "inventory") { const name = pick(h, r, ["description", "item", "name"]); if (!name || /^\d+$/.test(name)) return null; const q = pick(h, r, ["qty", "quantity"]); return { name, category: pick(h, r, ["category"]) || guessCat(name), qty: num(q), unit: (q.match(/[a-z]+/i) || [""])[0], counted: normDate(pick(h, r, ["date", "counted"])) }; }
  if (kind === "services") { const name = pick(h, r, ["service", "name"]); return name && { name, category: pick(h, r, ["category"]) || "Other", price: num(pick(h, r, ["price", "rate"])), active: true }; }
  if (kind === "expenses") { const amount = num(pick(h, r, ["amount", "total"])); return amount && { date: normDate(pick(h, r, ["date"])), category: pick(h, r, ["category"]) || "Others", item: pick(h, r, ["item", "description"]), qty: num(pick(h, r, ["qty"])), amount }; }
}
function guessCat(n) { n = n.toLowerCase(); if (/polish|polsih/.test(n)) return "Polish"; if (/lash|brow|tint|eye/.test(n)) return "Lash & brow"; if (/bed|chair|cctv|wifi|aircon|fan|table|storage|cart|signage|board|curtain/.test(n)) return "Equipment & furniture"; return "Supplies"; }
function readImport(file) {
  const kind = $("#impKind").value, fr = new FileReader();
  fr.onload = () => {
    const rows = parseCsv(String(fr.result));
    const hi = rows.findIndex(r => r.some(x => /desc|item|name|service|amount|date/i.test(x)));
    if (hi < 0 || rows.length < hi + 2) { $("#impPreview").innerHTML = `<p class="err">Couldn't find a heading row with data under it.</p>`; return; }
    const h = rows[hi].map(x => x.trim().toLowerCase()), out = rows.slice(hi + 1).map(r => mapRow(kind, h, r)).filter(Boolean);
    readImport.pending = { kind, out };
    $("#impPreview").innerHTML = out.length ? `<p class="note" style="margin:0 0 8px">Found <b>${out.length}</b> rows. First one: <b>${esc(out[0].name || out[0].item || out[0].date)}</b>.</p><button class="btn primary" type="button" id="impGo">Import ${out.length} rows</button>` : `<p class="err">No rows matched. ${IMPORT_HINTS[kind]}</p>`;
    const go = $("#impGo"); if (go) go.onclick = doImport;
  };
  fr.readAsText(file);
}
async function doImport() {
  const { kind, out } = readImport.pending || {}; if (!out || !S.db) return;
  const go = $("#impGo"); go.disabled = true; let n = 0;
  try { for (const d of out) { await S.db.collection(kind).add({ ...d, createdAt: now() }); n++; if (n % 10 === 0) go.textContent = `Importing… ${n}/${out.length}`; } $("#impPreview").innerHTML = `<p class="note">Imported ${n} rows.</p>`; toast(`Imported ${n} rows`); }
  catch (err) { $("#impPreview").innerHTML = `<p class="err">Stopped after ${n} rows: ${esc(errText(err))}</p>`; }
}

/* ---------- data wiring ---------- */
const allLoaded = () => COLS.every(c => S.loaded[c] || (ADMIN_COLS.includes(c) && !S.canPay));
let rq = false;
const queueRender = () => { if (rq) return; rq = true; requestAnimationFrame(() => { rq = false; render(); }); };
let searchT = 0; const renderSoon = () => { clearTimeout(searchT); searchT = setTimeout(render, 180); };
const VIEW_COLS = { overview: ["bookings", "expenses", "payroll", "staff", "services"], bookings: ["bookings", "staff", "services"], clients: ["bookings", "staff"], services: ["services", "bookings"], inventory: ["inventory"], payroll: ["staff", "staffpay", "payroll", "bookings", "backjobs"], checklist: ["kits", "kitchecks", "staff"], backjobs: ["backjobs", "staff", "bookings"], cash: ["bookings", "staff"], money: ["bookings", "staff", "expenses", "payroll", "moneylog"], expenses: ["expenses"], history: COLS, setup: ["logins", "staff", "services", "settings"] };
const recCache = new WeakMap();
async function boot() {
  route();
  const timer = setTimeout(() => { if (!allLoaded()) { S.offline = "Your records can't be reached right now. Check your connection; the page updates by itself when it reconnects."; $("#syncNote").textContent = "Offline"; render(); } }, 10000);
  const [db, user, downloads, sample, assets] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("downloads"), claude.use("sample"), claude.use("assets")]);
  S.downloads = downloads; S.sample = sample; S.assets = assets;
  if (user) { try { S.canEdit = await user.canEdit(); S._canPay = S.canEdit; S.isOwner = await user.isOwner(); S.uid = (await user.id()) || ""; } catch {} }
  if (SITE) ui.session = SITE.session;
  S.userReady = true;
  if (SITE) { try { history.replaceState(null, "", location.pathname + location.search + "#" + homeView()); } catch { } route(homeView()); } else route();
  if (!db) { clearTimeout(timer); S.offline = "Sign in to claude.ai to open the salon's records."; $("#syncNote").textContent = "Not connected"; render(); return; }
  S.rawDb = db; S.db = auditedDb(db);
  if (S.isOwner) db.collection("audit").onSnapshot(async snap => {
    S.audit = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    try { const ids = S.audit.map(a => a.id).filter(id => !S.people[id]); if (ids.length && user && user.profiles) { const ps = await user.profiles(ids); Object.assign(S.people, ps || {}); } } catch {}
    if (ui.view === "history") queueRender();
  }, () => {});
  db.doc("settings/main").onSnapshot(s => { S.settings = s.exists ? { ...s.data() } : {}; fmtCache = {}; applyTheme(); queueRender(); }, () => {});
  COLS.forEach(c => {
    if (ADMIN_COLS.includes(c) && !S.canPay) return;
    db.collection(c).onSnapshot(snap => {
      S[c] = snap.docs.map(d => { let r = recCache.get(d); if (!r) { r = { id: d.id, ...d.data() }; recCache.set(d, r); } return r; });
      if (c === "kits" && ui.kitId && !ui.kitDirty && !ui.kitCheck) { const kk = S.kits.find(x => x.id === ui.kitId); ui.kitDraft = kk ? kitClone(kk) : null; }
      if (!snap.metadata.fromCache) S.loaded[c] = true;
      const wasLoaded = S.loaded["_" + c]; S.loaded["_" + c] = true;
      if (allLoaded()) { clearTimeout(timer); S.offline = ""; $("#syncNote").textContent = "Saved online · live"; }
      if (!wasLoaded || c === "logins" || (VIEW_COLS[ui.view] || COLS).includes(c)) queueRender();
    }, err => { S.offline = errText(err); queueRender(); });
  });
  render();
}
applyTheme();
boot();
